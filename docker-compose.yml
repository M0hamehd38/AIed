services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classyar
      POSTGRES_USER: classyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classyar"]
      interval: 5s
      retries: 10
  redis:
    # carries live-session updates between server processes
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  stt:
    # speech-to-text (faster-whisper). Internal only: no port is published to the outside.
    build: ./stt
    environment:
      STT_TOKEN: ${STT_TOKEN:?set STT_TOKEN in .env}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-default}
    volumes:
      - models:/models   # downloaded once, then reused
    # with an NVIDIA GPU on the server, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://classyar:${POSTGRES_PASSWORD}@db:5432/classyar
      REDIS_URL: redis://redis:6379/0
      STT_URL: http://stt:9000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  scheduler:
    # hourly: delete transcript lines past their retention period
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://classyar:${POSTGRES_PASSWORD}@db:5432/classyar
    command: ["sh", "-c", "while true; do python manage.py purge_transcripts; sleep 3600; done"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  models:

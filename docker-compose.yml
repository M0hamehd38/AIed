services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classyar
      POSTGRES_USER: classyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classyar"]
      interval: 5s
      retries: 10
  redis:
    # carries live-session updates between server processes
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://classyar:${POSTGRES_PASSWORD}@db:5432/classyar
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  pgdata:

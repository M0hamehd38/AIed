    <div class="note" style="font-size:13px;color:var(--ink)">«برای بهبود تدریس، گفت‌وگوی کلاس به متن تبدیل می‌شود تا پرسش‌ها و ابهام‌های رایج مشخص شوند. صدا ذخیره نمی‌شود، گوینده‌ها شناسایی نمی‌شوند و متن پس از ${fa(settings.retention)} روز حذف می‌شود. هر زمان بخواهید می‌توانید درخواست توقف کنید.»</div>
    <label class="switch mt"><input type="checkbox" id="announced"> این متن را به کلاس اعلام کردم.</label>
    <div class="actions" style="display:flex;gap:8px;margin-top:16px"><button class="btn primary" data-act="consentOk">ثبت رضایت و شروع</button><button class="btn" data-act="closeModal">انصراف</button></div>`);
}

/* ================= actions ================= */
const THEME_ICONS = {sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>', moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
function paintThemeBtn() {
  const dark = document.documentElement.dataset.theme === 'dark', b = $('#themeBtn');
  b.innerHTML = dark ? THEME_ICONS.sun : THEME_ICONS.moon;
  b.setAttribute('aria-label', dark ? 'حالت روز' : 'حالت شب'); b.title = dark ? 'حالت روز' : 'حالت شب';
}
const ACT = {
  logout: () => { try { localStorage.removeItem('classyar-user'); } catch (e) {} location.href = 'index.html'; },
  toggleTheme: () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('classyar-theme', t); } catch (e) {}
    paintThemeBtn(); if (state.view === 'audio') drawWave();
  },
  go: el => { state.view = el.dataset.v; state.studentId = null; location.hash = state.view; closeMenu(); render(); window.scrollTo(0, 0); },
  openMenu: () => { $('#sidebar').classList.add('open'); $('#backdrop').classList.add('open'); $('#nav .nav-btn').focus(); },
  closeMenu: () => closeMenu(),
  filterAttention: () => { state.stFilter = 'attention'; ACT.go({dataset:{v:'students'}}); },
  evidence: el => showEvidence(JSON.parse(el.dataset.ev)),
  student: el => { if ($('#modalBg').classList.contains('open')) closeModal(); state.view = 'students'; state.studentId = +el.dataset.id; location.hash = 'student-' + state.studentId; closeMenu(); render(); window.scrollTo(0, 0); },
  exportStudent: el => {
    const s = students[+el.dataset.id], rs = responses.filter(r => r.sid === s.id).map(r => ({session:r.session, question:A.qById(r.qid).text, answer:A.qById(r.qid).options[r.opt], correct:r.ok}));
    const json = JSON.stringify({code:s.code, name:s.name, course:course.title, responses:rs}, null, 2);
    openModal(`خروجی داده‌های ${esc(studentName(s))}`, `<p class="muted small" style="margin-top:0">${fa(rs.length)} پاسخ · قالب JSON</p><pre id="exportJson" tabindex="0" style="direction:ltr;text-align:left;max-height:50vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px">${esc(json)}</pre><button class="btn primary mt" data-act="copyExport">کپی</button>`);
  },
  copyExport: () => {
    const pre = $('#exportJson');
    const select = () => { const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    if (navigator.clipboard) navigator.clipboard.writeText(pre.textContent).then(() => toast('کپی شد.'), () => { select(); toast('متن انتخاب شد؛ با Ctrl+C کپی کنید.'); });
    else { select(); toast('متن انتخاب شد؛ با Ctrl+C کپی کنید.'); }
  },
  closeModal: () => closeModal(),
  modalBg: (el, e) => { if (e.target === el) closeModal(); },
  sort: el => { const k = el.dataset.k; state.stSort = {k, dir:state.stSort.k === k ? -state.stSort.dir : (k === 'name' ? 1 : -1)}; render(); },
  decide: el => {
    const s = suggestions.find(x => x.id === el.dataset.id); s.status = el.dataset.d;
    audit.unshift({who:course.teacher, when:'امروز · ' + nowTime(), action:s.status === 'approved' ? 'تأیید' : 'رد', target:s.title});
    toast(s.status === 'approved' ? 'پیشنهاد تأیید و در لاگ ممیزی ثبت شد.' : 'پیشنهاد رد و در لاگ ممیزی ثبت شد.'); render();
  },
  editSugg: el => {
    const s = suggestions.find(x => x.id === el.dataset.id);
    openModal('ویرایش پیشنهاد', `<div class="field"><label for="eTitle">عنوان</label><input type="text" id="eTitle" value="${esc(s.title)}"></div><div class="field"><label for="eAction">اقدام پیشنهادی</label><textarea id="eAction">${esc(s.action)}</textarea></div><button class="btn primary" data-act="saveEdit" data-id="${s.id}">ذخیره</button>`);
  },
  saveEdit: el => {
    const s = suggestions.find(x => x.id === el.dataset.id);
    s.title = $('#eTitle').value.trim() || s.title; s.action = $('#eAction').value.trim() || s.action; s.edited = true;
    audit.unshift({who:course.teacher, when:'امروز · ' + nowTime(), action:'ویرایش', target:s.title}); closeModal(); toast('ویرایش ذخیره شد.'); render();
  },
  draftQuestion: el => {
    const s = suggestions.find(x => x.id === el.dataset.id), src = A.qById(s.qid);
    const nq = {id:questions.length + 1, session:curSession() ? curSession().n : 1, concepts:src.concepts.slice(), text:`(پیش‌نویس، مشابه سؤال ${fa(src.id)}) ${src.text}`, options:src.options.slice(), correct:src.correct, mis:src.mis, diff:src.diff, status:'draft', source:'ai_draft', asked:false};
    questions.push(nq); s.drafted = true;
    audit.unshift({who:course.teacher, when:'امروز · ' + nowTime(), action:'ساخت پیش‌نویس', target:`سؤال ${fa(nq.id)} برای بازبینی`});
    toast('پیش‌نویس به بانک سؤال اضافه شد و تا تأیید شما استفاده نمی‌شود.'); render();
  },
  approveQ: el => { A.qById(+el.dataset.id).status = 'approved'; toast('سؤال تأیید شد و به بانک اضافه شد.'); render(); },
  liveStart: () => { live.running = true; live.startedAt = Date.now(); live.code = String(100000 + Math.floor(Math.random() * 900000)); render(); },
  liveEnd: () => { if (live.qState && live.qState !== 'closed') ACT.liveClose(); clearInterval(live.timer); Object.assign(live, {running:false, code:null, qid:null, qState:null, answers:[]}); toast('جلسه پایان یافت و کد ورود باطل شد.'); render(); },
  liveAsk: el => {
    live.qid = +el.dataset.id; live.qState = 'open'; live.answers = []; live.previewSel = null;
    live.pending = students.filter(s => R() < attendProb(s, curSession().n) * 0.95).sort(() => R() - 0.5);
    clearInterval(live.timer); live.timer = setInterval(liveTick, 700); render();
  },
  livePause: () => { live.qState = 'paused'; render(); },
  liveResume: () => { live.qState = 'open'; render(); },
  liveClose: () => {
    const q = A.qById(live.qid); live.qState = 'closed'; clearInterval(live.timer);
    const sn = curSession().n;
    for (const r of responses.filter(r => r.qid === q.id && r.session === sn)) responses.splice(responses.indexOf(r), 1);
    live.answers.forEach(a => responses.push({sid:a.sid, qid:q.id, session:sn, opt:a.opt, ok:a.opt === q.correct}));
    if (!q.asked) { q.asked = true; q.session = sn; } buildSuggestions(); toast(`${fa(live.answers.length)} پاسخ در جلسه‌ی ${fa(sn)} ذخیره شد.`); render();
  },
  liveNext: () => { live.qid = null; live.qState = null; live.answers = []; render(); },
  previewPick: el => { live.previewSel = +el.dataset.i; render(); },
  audioStart: () => course.consent ? startListening() : consentModal(),
  audioStop: () => { audio.listening = false; clearInterval(audio.timer); toast('شنود متوقف شد.'); render(); },
  consentOk: () => { if (!$('#announced').checked) { toast('لطفاً اعلام به کلاس را تأیید کنید.'); return; } course.consent = true; closeModal(); startListening(); },
  enterCourse: el => { switchCourse(+el.dataset.id); ACT.go({dataset:{v:'dashboard'}}); },
  manageCourse: el => { switchCourse(+el.dataset.id); render(); },
  newCourse: () => openModal('ایجاد درس جدید', `<form id="courseForm" novalidate><div class="form-grid">
    <div class="field full"><label for="ncTitle">نام درس *</label><input type="text" id="ncTitle" placeholder="مثلاً طراحی الگوریتم" required></div>
    <div class="field"><label for="ncCode">کد درس</label><input type="text" id="ncCode" placeholder="CS301"></div>
    <div class="field"><label for="ncGroup">گروه</label><input type="text" id="ncGroup" placeholder="گروه ۱"></div>
    <div class="field"><label for="ncTerm">ترم</label><input type="text" id="ncTerm" value="پاییز ۱۴۰۵"></div>
    <div class="field"><label for="ncSchedule">زمان کلاس</label><input type="text" id="ncSchedule" placeholder="دوشنبه ۱۴–۱۶"></div>
    <div class="field full"><label for="ncConcepts">مفاهیم درس *</label><textarea id="ncConcepts" placeholder="هر مفهوم در یک خط"></textarea><span class="help">بعداً هم می‌توانید مفهوم اضافه کنید.</span></div>
    </div><p class="small" id="ncError" style="color:var(--red);min-height:1em"></p><div style="display:flex;gap:8px"><button class="btn primary" type="submit">ایجاد درس</button><button class="btn" type="button" data-act="closeModal">انصراف</button></div></form>`),
  addSession: () => {
    const d = $('#newSessDate').value.trim(), t = $('#newSessTopic').value.trim();
    if (!d || !t) { toast('تاریخ و موضوع جلسه را وارد کنید.'); return; }
    sessions.push({n:sessions.length + 1, date:d, topic:t}); toast(`جلسه‌ی ${fa(sessions.length)} اضافه شد.`); render();
  },
  newQuestion: () => openModal('سؤال جدید', `<form id="questionForm" novalidate>
    <div class="field"><label for="nqText">متن سؤال *</label><textarea id="nqText"></textarea></div>
    <div class="field"><label>گزینه‌ها * <span class="help">گزینه‌ی درست را علامت بزنید</span></label>
      ${[0, 1, 2, 3].map(i => `<div class="opt-row"><input type="radio" name="nqCorrect" id="nqC${i}" value="${i}" ${i === 0 ? 'checked' : ''} aria-label="گزینه‌ی ${fa(i + 1)} درست است"><input type="text" id="nqO${i}" placeholder="گزینه‌ی ${fa(i + 1)}" aria-label="گزینه‌ی ${fa(i + 1)}"></div>`).join('')}</div>
    <div class="field"><label>مفاهیم مرتبط *</label><div class="chips">${concepts.map(c => `<label class="tag gray" style="cursor:pointer"><input type="checkbox" name="nqConcept" value="${c.id}"> ${esc(c.t)}</label>`).join('')}</div></div>
    <p class="small" id="nqError" style="color:var(--red);min-height:1em"></p><div style="display:flex;gap:8px"><button class="btn primary" type="submit">افزودن به بانک سؤال</button><button class="btn" type="button" data-act="closeModal">انصراف</button></div></form>`),
  addConcept: () => { const v = $('#newConcept').value.trim(); if (!v) return; concepts.push({id:concepts.length, t:v, from:(curSession() ? curSession().n : 0) + 1, color:CONCEPT_COLORS[concepts.length % CONCEPT_COLORS.length]}); students.forEach(st => st.ability.push(1)); toast('مفهوم اضافه شد.'); render(); },
  confirmCsv: () => { const rows = window.__csv || []; rows.forEach(([code, name]) => students.push({id:students.length, code:fa(code), name, ability:concepts.map(() => 0.9), part:0.9, decl:false})); toast(`${fa(rows.length)} دانشجو اضافه شد.`); window.__csv = null; render(); },
  saveSettings: () => {
    const g = +$('#sGreen').value / 100, o = +$('#sOrange').value / 100;
    if (!(o > 0 && g > o && g <= 1)) { toast('آستانه‌ی سبز باید بزرگ‌تر از نارنجی باشد.'); return; }
    Object.assign(settings, {green:g, orange:o, minClass:Math.max(1, +$('#sMinC').value), minStudent:Math.max(1, +$('#sMinS').value), dropAlert:Math.max(1, +$('#sDrop').value), showNames:$('#sNames').checked, retention:Math.max(1, +$('#sRet').value)});
    buildSuggestions(); toast('تنظیمات ذخیره شد.'); render();
  },
};
function closeMenu() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('open'); }
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; if (el.closest('tr[data-act]') && el !== el.closest('tr[data-act]')) e.stopPropagation(); ACT[el.dataset.act]?.(el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modalBg').classList.contains('open')) closeModal(); else closeMenu(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); ACT[e.target.dataset.act](e.target, e); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'stSearch') { state.stQuery = e.target.value; const pos = e.target.selectionStart; render(); const i = $('#stSearch'); i.focus(); i.setSelectionRange(pos, pos); }
});
function switchCourse(id) {
  if (courses[id] === course) return;
  if (live.running) ACT.liveEnd();
  if (audio.listening) ACT.audioStop();
  Object.assign(audio, {lines:[], idx:0, counts:{question:0, confusion:0, repeat:0, example:0, topic:0}});
  useCourse(id); buildSuggestions();
  Object.assign(state, {studentId:null, stQuery:'', stFilter:'all'});
  toast(`درس فعال: ${course.title}`);
}
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'courseForm') {
    const title = $('#ncTitle').value.trim(), cs = $('#ncConcepts').value.split(/[\n،,]/).map(x => x.trim()).filter(Boolean);
    if (!title || !cs.length) { $('#ncError').textContent = 'نام درس و دست‌کم یک مفهوم لازم است.'; (title ? $('#ncConcepts') : $('#ncTitle')).focus(); return; }
    const prev = course.id, c = addCourse({title, code:$('#ncCode').value.trim(), group:$('#ncGroup').value.trim(), term:$('#ncTerm').value.trim(), schedule:$('#ncSchedule').value.trim(), concepts:cs.map(t => [t, 1])});
    useCourse(prev); closeModal(); switchCourse(c.id); render();
  }
  if (e.target.id === 'questionForm') {
    const text = $('#nqText').value.trim(), opts = [0, 1, 2, 3].map(i => $('#nqO' + i).value.trim());
    const correct = +document.querySelector('input[name=nqCorrect]:checked').value, cs = [...document.querySelectorAll('input[name=nqConcept]:checked')].map(x => +x.value);
    if (!text || opts.some(o => !o) || !cs.length) { $('#nqError').textContent = 'متن سؤال، هر چهار گزینه و دست‌کم یک مفهوم لازم است.'; return; }
    questions.push({id:questions.length + 1, session:curSession() ? curSession().n : 1, concepts:cs, text, options:opts, correct, mis:(correct + 1) % 4, diff:0, status:'approved', source:'manual', asked:false});
    closeModal(); toast('سؤال به بانک اضافه شد.'); render();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'courseSel') { switchCourse(+e.target.value); location.hash = state.view; render(); }
  if (e.target.id === 'stFilter') { state.stFilter = e.target.value; render(); }
  if (e.target.id === 'stSort') { const [k, d] = e.target.value.split(':'); state.stSort = {k, dir:+d}; render(); }
  if (e.target.id === 'csv' && e.target.files[0]) {
    e.target.files[0].text().then(txt => {
      const rows = txt.split(/\r?\n/).map(l => l.split(/[,،;\t]/).map(x => x.trim())).filter(r => r.length >= 2 && r[1] && !/نام|name/i.test(r[1]));
      window.__csv = rows;
      $('#csvPreview').innerHTML = rows.length ? `<p class="small">${fa(rows.length)} ردیف معتبر پیدا شد. پیش‌نمایش:</p><table><tbody>${rows.slice(0, 5).map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table><button class="btn primary mt" data-act="confirmCsv">افزودن به درس</button>` : '<p class="small muted">ردیف معتبری پیدا نشد.</p>';
    });
  }
});

/* ================= render ================= */
function render() {
  $('#pageTitle').innerHTML = state.view === 'dashboard' ? `سلام ${esc(course.teacher)} <span class="hand" role="img" aria-label="دست تکان‌دادن">👋</span>` : state.view === 'students' && state.studentId != null ? 'نمایه‌ی دانشجو' : T.nav[state.view];
  $('#pageSub').textContent = state.view === 'dashboard' ? `${course.title} · ${course.term} · ${curSession() ? 'آخرین جلسه ' + curSession().date : 'بدون جلسه'} — نگاهی به وضعیت کلاس شما` : T.sub[state.view];
  $('#courseSel').innerHTML = courses.map(c => `<option value="${c.id}" ${c === course ? 'selected' : ''}>${esc(c.title)}${c.group ? ' · ' + esc(c.group) : ''}</option>`).join('');
  $('#lessonSub').textContent = curSession() ? `جلسه‌ی ${fa(curSession().n)} · ${curSession().topic}` : 'هنوز جلسه‌ای تعریف نشده';
  $('#teacherName').textContent = course.teacher;
  $('#teacherAvatar').textContent = course.teacher.replace('دکتر', '').trim()[0];
  $('#liveChip').classList.toggle('on', live.running);
  const pend = suggestions.filter(s => s.status === 'pending').length;
  $('#bell').innerHTML = $('#bell').innerHTML.replace(/<span class="dot"[^>]*><\/span>/, '') + (pend ? '<span class="dot" aria-hidden="true"></span>' : '');
  $('#bell').setAttribute('aria-label', pend ? `اعلان‌ها: ${fa(pend)} پیشنهاد در انتظار` : 'اعلان‌ها');
  $('#aiWidget').innerHTML = `<div class="bot" aria-hidden="true">AI</div>${audio.listening ? '<b>در حال تحلیل صدا</b><br>رونوشت و نشانه‌های گفتاری کلاس…' : live.running ? '<b>جلسه‌ی زنده فعال است</b><br>پاسخ‌ها لحظه‌ای تحلیل می‌شوند.' : `<b>دستیار آماده است</b><br>${fa(pend)} پیشنهاد منتظر تصمیم شما.`}<div class="eq ${audio.listening ? 'on' : ''}" aria-hidden="true">${Array.from({length:22}, (_, i) => `<i style="animation-delay:${(i % 7) * 0.12}s"></i>`).join('')}</div>`;
  $('#listenPill').classList.toggle('on', audio.listening);
  renderNav();
  $('#view').innerHTML = V[state.view]();
  document.querySelectorAll('tr[data-act]').forEach(tr => tr.tabIndex = 0);
  if (state.view === 'audio') { const el = $('#transcript'); el.scrollTop = el.scrollHeight; if (!audio.raf) drawWave(); }
}
function readHash() { const v = location.hash.slice(1), m = v.match(/^student-(\d+)$/); if (m) { state.view = 'students'; state.studentId = +m[1]; return true; } if (T.nav[v]) { state.view = v; state.studentId = null; return true; } return false; }
window.addEventListener('hashchange', () => { if (readHash()) render(); });
setInterval(() => { if (!live.running) return; const t = Math.floor((Date.now() - live.startedAt) / 1000); $('#timer').textContent = [t / 3600, t / 60 % 60, t % 60].map(x => String(Math.floor(x)).padStart(2, '0')).join(':'); }, 1000);
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.person[data-act]')) { e.preventDefault(); ACT.student(e.target); } });
buildSuggestions();
readHash();
render();
paintThemeBtn();
</script>
</body>
</html>
